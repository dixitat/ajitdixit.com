<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Solar System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #000000, #0a0a1a);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        #canvas {
            display: block;
            cursor: grab;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000000 100%);
        }

        #canvas:active {
            cursor: grabbing;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }

        .controls h2 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #4a9eff;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }

        .control-group input,
        .control-group button {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .control-group button {
            background: #4a9eff;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }

        .control-group button:hover {
            background: #357abd;
        }

        .zoom-controls {
            display: flex;
            gap: 10px;
        }

        .zoom-controls button {
            flex: 1;
        }

        .planet-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
        }

        .planet-info.visible {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .planet-info h2 {
            color: #4a9eff;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .planet-info .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
        }

        .planet-info .close-btn:hover {
            color: #4a9eff;
        }

        .info-row {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .info-value {
            color: white;
            font-size: 16px;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #aaa;
        }

        .instructions div {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <h2>Solar System Controls</h2>
        
        <div class="control-group">
            <label for="dateInput">Date & Time:</label>
            <input type="datetime-local" id="dateInput">
            <button onclick="updateDate()">Update Position</button>
            <button onclick="setToday()">Today</button>
        </div>

        <div class="control-group">
            <label>Zoom:</label>
            <div class="zoom-controls">
                <button onclick="zoomIn()">Zoom In</button>
                <button onclick="zoomOut()">Zoom Out</button>
            </div>
        </div>

        <div class="control-group">
            <button onclick="resetView()">Reset View</button>
        </div>
    </div>

    <div class="planet-info" id="planetInfo">
        <button class="close-btn" onclick="closePlanetInfo()">&times;</button>
        <div id="planetInfoContent"></div>
    </div>

    <div class="instructions">
        <div><strong>Controls:</strong></div>
        <div>• Drag to pan</div>
        <div>• Scroll to zoom</div>
        <div>• Click planet to view info</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Camera settings
        let camera = {
            x: 0,
            y: 0,
            zoom: 1,
            targetZoom: 1
        };

        // Mouse interaction
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // Astronomical Unit in pixels (for scaling)
        const AU = 80;

        // Current date
        let currentDate = new Date();

        // Planet data with orbital parameters
        const planets = [
            {
                name: 'Mercury',
                color: '#8C7853',
                radius: 4,
                semiMajorAxis: 0.387 * AU,
                eccentricity: 0.205,
                orbitalPeriod: 87.97,
                longitudeOfPerihelion: 77.45,
                meanLongitude: 252.25,
                diameter: '4,879 km',
                mass: '3.30 × 10²³ kg',
                gravity: '3.7 m/s²',
                dayLength: '59 Earth days',
                distanceFromSun: '57.9 million km',
                moons: '0',
                description: 'The smallest and innermost planet in the Solar System. Mercury has virtually no atmosphere and experiences extreme temperature variations.'
            },
            {
                name: 'Venus',
                color: '#FFC649',
                radius: 9,
                semiMajorAxis: 0.723 * AU,
                eccentricity: 0.007,
                orbitalPeriod: 224.70,
                longitudeOfPerihelion: 131.53,
                meanLongitude: 181.97,
                diameter: '12,104 km',
                mass: '4.87 × 10²⁴ kg',
                gravity: '8.9 m/s²',
                dayLength: '243 Earth days',
                distanceFromSun: '108.2 million km',
                moons: '0',
                description: 'The hottest planet in our solar system with surface temperatures around 462°C. Venus rotates backwards compared to other planets.'
            },
            {
                name: 'Earth',
                color: '#4A90E2',
                radius: 10,
                semiMajorAxis: 1.0 * AU,
                eccentricity: 0.017,
                orbitalPeriod: 365.26,
                longitudeOfPerihelion: 102.94,
                meanLongitude: 100.46,
                diameter: '12,742 km',
                mass: '5.97 × 10²⁴ kg',
                gravity: '9.8 m/s²',
                dayLength: '24 hours',
                distanceFromSun: '149.6 million km',
                moons: '1 (The Moon)',
                description: 'Our home planet, the only known world to harbor life. Earth has a protective atmosphere and liquid water on its surface.'
            },
            {
                name: 'Mars',
                color: '#E27B58',
                radius: 5,
                semiMajorAxis: 1.524 * AU,
                eccentricity: 0.093,
                orbitalPeriod: 686.98,
                longitudeOfPerihelion: 336.04,
                meanLongitude: 355.45,
                diameter: '6,779 km',
                mass: '6.42 × 10²³ kg',
                gravity: '3.7 m/s²',
                dayLength: '24.6 hours',
                distanceFromSun: '227.9 million km',
                moons: '2 (Phobos, Deimos)',
                description: 'The Red Planet, named for the Roman god of war. Mars has the largest volcano in the solar system, Olympus Mons.'
            },
            {
                name: 'Jupiter',
                color: '#C88B3A',
                radius: 35,
                semiMajorAxis: 5.203 * AU,
                eccentricity: 0.048,
                orbitalPeriod: 4332.59,
                longitudeOfPerihelion: 14.75,
                meanLongitude: 34.40,
                diameter: '139,820 km',
                mass: '1.90 × 10²⁷ kg',
                gravity: '24.8 m/s²',
                dayLength: '9.9 hours',
                distanceFromSun: '778.5 million km',
                moons: '95 known moons',
                description: 'The largest planet in our solar system. Jupiter\'s Great Red Spot is a giant storm larger than Earth that has raged for centuries.'
            },
            {
                name: 'Saturn',
                color: '#FAD5A5',
                radius: 30,
                semiMajorAxis: 9.537 * AU,
                eccentricity: 0.054,
                orbitalPeriod: 10759.22,
                longitudeOfPerihelion: 92.43,
                meanLongitude: 49.94,
                diameter: '116,460 km',
                mass: '5.68 × 10²⁶ kg',
                gravity: '10.4 m/s²',
                dayLength: '10.7 hours',
                distanceFromSun: '1.43 billion km',
                moons: '146 known moons',
                description: 'Famous for its spectacular ring system made of ice and rock particles. Saturn is the least dense planet and could float in water.'
            },
            {
                name: 'Uranus',
                color: '#4FD0E7',
                radius: 20,
                semiMajorAxis: 19.191 * AU,
                eccentricity: 0.047,
                orbitalPeriod: 30688.5,
                longitudeOfPerihelion: 170.96,
                meanLongitude: 313.23,
                diameter: '50,724 km',
                mass: '8.68 × 10²⁵ kg',
                gravity: '8.7 m/s²',
                dayLength: '17.2 hours',
                distanceFromSun: '2.87 billion km',
                moons: '27 known moons',
                description: 'An ice giant that rotates on its side. Uranus has a blue-green color due to methane in its atmosphere.'
            },
            {
                name: 'Neptune',
                color: '#4169E1',
                radius: 19,
                semiMajorAxis: 30.069 * AU,
                eccentricity: 0.009,
                orbitalPeriod: 60182,
                longitudeOfPerihelion: 44.97,
                meanLongitude: 304.88,
                diameter: '49,244 km',
                mass: '1.02 × 10²⁶ kg',
                gravity: '11.1 m/s²',
                dayLength: '16.1 hours',
                distanceFromSun: '4.50 billion km',
                moons: '14 known moons',
                description: 'The windiest planet in the solar system with speeds reaching 2,100 km/h. Neptune was the first planet located through mathematical predictions.'
            }
        ];

        // Calculate orbital position based on date
        function calculateOrbitalPosition(planet, date) {
            // Days since J2000.0 (January 1, 2000, 12:00 TT)
            const J2000 = new Date('2000-01-01T12:00:00Z');
            const daysSinceJ2000 = (date - J2000) / (1000 * 60 * 60 * 24);
            
            // Mean anomaly
            const M = ((planet.meanLongitude + (360 / planet.orbitalPeriod) * daysSinceJ2000) % 360) * Math.PI / 180;
            
            // Solve Kepler's equation for eccentric anomaly (using Newton's method)
            let E = M;
            for (let i = 0; i < 10; i++) {
                E = E - (E - planet.eccentricity * Math.sin(E) - M) / (1 - planet.eccentricity * Math.cos(E));
            }
            
            // True anomaly
            const v = 2 * Math.atan2(
                Math.sqrt(1 + planet.eccentricity) * Math.sin(E / 2),
                Math.sqrt(1 - planet.eccentricity) * Math.cos(E / 2)
            );
            
            // Distance from sun
            const r = planet.semiMajorAxis * (1 - planet.eccentricity * Math.cos(E));
            
            // Position in orbital plane
            const omega = planet.longitudeOfPerihelion * Math.PI / 180;
            const theta = v + omega;
            
            return {
                x: r * Math.cos(theta),
                y: r * Math.sin(theta),
                angle: theta
            };
        }

        // Draw everything
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            
            // Apply camera transform
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);
            
            // Draw stars
            drawStars();
            
            // Draw orbits
            planets.forEach(planet => {
                drawOrbit(planet);
            });
            
            // Draw Sun
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 40);
            gradient.addColorStop(0, '#FDB813');
            gradient.addColorStop(0.5, '#FD8213');
            gradient.addColorStop(1, 'rgba(253, 130, 19, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 40, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw planets
            planets.forEach(planet => {
                const pos = calculateOrbitalPosition(planet, currentDate);
                drawPlanet(planet, pos.x, pos.y);
            });
            
            ctx.restore();
            
            // Smooth zoom
            camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;
            
            requestAnimationFrame(draw);
        }

        // Draw orbit ellipse
        function drawOrbit(planet) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1 / camera.zoom;
            ctx.beginPath();
            
            const a = planet.semiMajorAxis;
            const b = a * Math.sqrt(1 - planet.eccentricity * planet.eccentricity);
            const c = a * planet.eccentricity;
            const omega = planet.longitudeOfPerihelion * Math.PI / 180;
            
            for (let angle = 0; angle <= Math.PI * 2; angle += 0.01) {
                const r = a * (1 - planet.eccentricity * planet.eccentricity) / (1 + planet.eccentricity * Math.cos(angle));
                const x = r * Math.cos(angle + omega);
                const y = r * Math.sin(angle + omega);
                
                if (angle === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
        }

        // Draw planet
        function drawPlanet(planet, x, y) {
            // Glow effect
            const glowGradient = ctx.createRadialGradient(x, y, 0, x, y, planet.radius * 2);
            glowGradient.addColorStop(0, planet.color);
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Planet body
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Highlight
            const highlightGradient = ctx.createRadialGradient(
                x - planet.radius * 0.3, y - planet.radius * 0.3, 0,
                x, y, planet.radius
            );
            highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = highlightGradient;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Label
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = `${12 / camera.zoom}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, x, y + planet.radius + 15 / camera.zoom);
            
            // Special rings for Saturn
            if (planet.name === 'Saturn') {
                ctx.strokeStyle = 'rgba(250, 213, 165, 0.6)';
                ctx.lineWidth = 3 / camera.zoom;
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 1.8, planet.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Draw background stars
        let stars = [];
        function initStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * 4000,
                    y: (Math.random() - 0.5) * 4000,
                    radius: Math.random() * 1.5,
                    opacity: Math.random() * 0.5 + 0.3
                });
            }
        }
        initStars();

        function drawStars() {
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius / camera.zoom, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                camera.x += dx;
                camera.y += dy;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            camera.targetZoom = Math.max(0.1, Math.min(5, camera.targetZoom * zoomFactor));
        });

        // Click to select planet
        canvas.addEventListener('click', (e) => {
            if (isDragging) return;
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - canvas.width / 2 - camera.x) / camera.zoom;
            const mouseY = (e.clientY - rect.top - canvas.height / 2 - camera.y) / camera.zoom;
            
            planets.forEach(planet => {
                const pos = calculateOrbitalPosition(planet, currentDate);
                const dx = mouseX - pos.x;
                const dy = mouseY - pos.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < planet.radius * 2) {
                    showPlanetInfo(planet);
                }
            });
        });

        // Show planet information
        function showPlanetInfo(planet) {
            const infoDiv = document.getElementById('planetInfo');
            const contentDiv = document.getElementById('planetInfoContent');
            
            contentDiv.innerHTML = `
                <h2>${planet.name}</h2>
                <p style="color: #aaa; margin-bottom: 20px; line-height: 1.5;">${planet.description}</p>
                
                <div class="info-row">
                    <div class="info-label">Diameter</div>
                    <div class="info-value">${planet.diameter}</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Mass</div>
                    <div class="info-value">${planet.mass}</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Surface Gravity</div>
                    <div class="info-value">${planet.gravity}</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Day Length</div>
                    <div class="info-value">${planet.dayLength}</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Distance from Sun</div>
                    <div class="info-value">${planet.distanceFromSun}</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Orbital Period</div>
                    <div class="info-value">${planet.orbitalPeriod.toFixed(2)} Earth days</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Known Moons</div>
                    <div class="info-value">${planet.moons}</div>
                </div>
            `;
            
            infoDiv.classList.add('visible');
        }

        function closePlanetInfo() {
            document.getElementById('planetInfo').classList.remove('visible');
        }

        // Control functions
        function updateDate() {
            const input = document.getElementById('dateInput');
            if (input.value) {
                currentDate = new Date(input.value);
            }
        }

        function setToday() {
            currentDate = new Date();
            const input = document.getElementById('dateInput');
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            const localDate = new Date(now - offset);
            input.value = localDate.toISOString().slice(0, 16);
        }

        function zoomIn() {
            camera.targetZoom = Math.min(5, camera.targetZoom * 1.3);
        }

        function zoomOut() {
            camera.targetZoom = Math.max(0.1, camera.targetZoom / 1.3);
        }

        function resetView() {
            camera.x = 0;
            camera.y = 0;
            camera.targetZoom = 1;
            camera.zoom = 1;
        }

        // Initialize date input
        setToday();

        // Start animation
        draw();
    </script>
</body>
</html>
