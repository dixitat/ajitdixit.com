<!DOCTYPE html>
<html>
<head>
    <title>Mobile-Friendly Game</title>
    <style>
        canvas {
            border: 1px solid black;
            touch-action: none; /* Prevents default touch behaviors */
        }
        .controls {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            width: 300px;
        }
        .dpad {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left center right"
                ". down .";
            gap: 5px;
        }
        .dpad button {
            width: 50px;
            height: 50px;
            font-size: 20px;
        }
        .up { grid-area: up; }
        .left { grid-area: left; }
        .right { grid-area: right; }
        .down { grid-area: down; }
        .shoot-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ff4444;
            color: white;
            border: none;
            font-size: 20px;
        }
    </style>
<script defer data-domain="www.ajitdixit.com" src="https://analytics.tiiny.site/js/plausible.js"></script></head>
<body>
    <canvas id="gameCanvas" width="300" height="400"></canvas>
    <div class="controls">
        <div class="dpad">
            <button class="up">↑</button>
            <button class="left">←</button>
            <button class="right">→</button>
            <button class="down">↓</button>
        </div>
        <button class="shoot-btn">Shoot</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Player properties
        let player = {
            x: 150,
            y: 350,
            width: 20,
            height: 20,
            speed: 5
        };

        // Bullets array
        let bullets = [];

        // Control states
        let controls = {
            up: false,
            down: false,
            left: false,
            right: false
        };

        // Get button elements
        const upBtn = document.querySelector('.up');
        const downBtn = document.querySelector('.down');
        const leftBtn = document.querySelector('.left');
        const rightBtn = document.querySelector('.right');
        const shootBtn = document.querySelector('.shoot-btn');

        // Button event listeners
        function addButtonListeners(btn, direction, state) {
            btn.addEventListener('touchstart', () => controls[direction] = state);
            btn.addEventListener('touchend', () => controls[direction] = !state);
            // For desktop testing
            btn.addEventListener('mousedown', () => controls[direction] = state);
            btn.addEventListener('mouseup', () => controls[direction] = !state);
        }

        addButtonListeners(upBtn, 'up', true);
        addButtonListeners(downBtn, 'down', true);
        addButtonListeners(leftBtn, 'left', true);
        addButtonListeners(rightBtn, 'right', true);

        shootBtn.addEventListener('touchstart', shoot);
        shootBtn.addEventListener('mousedown', shoot);

        function shoot() {
            bullets.push({
                x: player.x + player.width/2,
                y: player.y,
                speed: 7
            });
        }

        function update() {
            // Move player
            if (controls.up && player.y > 0) player.y -= player.speed;
            if (controls.down && player.y < canvas.height - player.height) player.y += player.speed;
            if (controls.left && player.x > 0) player.x -= player.speed;
            if (controls.right && player.x < canvas.width - player.width) player.x += player.speed;

            // Update bullets
            bullets = bullets.filter(b => b.y > 0);
            bullets.forEach(bullet => {
                bullet.y -= bullet.speed;
            });
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw player
            ctx.fillStyle = 'blue';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw bullets
            ctx.fillStyle = 'red';
            bullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
