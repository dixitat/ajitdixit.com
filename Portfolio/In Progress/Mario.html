<!DOCTYPE html>
<html>
<head>
    <title>Simple Mario Game</title>
    <style>
        #game {
            width: 800px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            background: skyblue;
            overflow: hidden;
        }
        
        #mario {
            width: 40px;
            height: 60px;
            background: red;
            position: absolute;
            bottom: 0;
            left: 100px;
        }
        
        #platform {
            width: 200px;
            height: 20px;
            background: brown;
            position: absolute;
            bottom: 100px;
            left: 300px;
        }
    </style>
<script defer data-domain="www.ajitdixit.com" src="https://analytics.tiiny.site/js/plausible.js"></script></head>
<body>
    <div id="game">
        <div id="mario"></div>
        <div id="platform"></div>
    </div>

    <script>
        const mario = document.getElementById('mario');
        let positionX = 100;  // Horizontal position
        let positionY = 0;    // Vertical position (0 is ground)
        let velocityY = 0;    // Vertical velocity
        let isJumping = false;
        const gravity = 0.5;
        const jumpStrength = 12;

        // Update Mario's position
        function updatePosition() {
            // Apply gravity
            velocityY -= gravity;
            positionY += velocityY;

            // Check ground collision
            if (positionY <= 0) {
                positionY = 0;
                velocityY = 0;
                isJumping = false;
            }

            // Update CSS
            mario.style.left = positionX + 'px';
            mario.style.bottom = positionY + 'px';
        }

        // Game loop
        function gameLoop() {
            updatePosition();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // Handle keyboard controls
        document.addEventListener('keydown', (event) => {
            switch(event.key) {
                case 'ArrowRight':
                    if (positionX < 760) {
                        positionX += 20;
                    }
                    break;
                case 'ArrowLeft':
                    if (positionX > 0) {
                        positionX -= 20;
                    }
                    break;
                case 'ArrowUp':
                    if (!isJumping) {
                        jump();
                    }
                    break;
            }
        });

        function jump() {
            isJumping = true;
            velocityY = jumpStrength;
        }

        // Basic collision detection
        function checkCollision() {
            const marioRect = mario.getBoundingClientRect();
            const platformRect = document.getElementById('platform').getBoundingClientRect();
            
            return marioRect.bottom > platformRect.top &&
                   marioRect.top < platformRect.bottom &&
                   marioRect.right > platformRect.left &&
                   marioRect.left < platformRect.right;
        }
    </script>
</body>
</html>
